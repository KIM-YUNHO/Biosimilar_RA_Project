# 한국어 질의 → 영어 원문 용어 (규칙 기반 질의 확장, LLM 없음)
# 질문에 왼쪽 용어가 있으면 오른쪽 영어 용어를 질의 뒤에 붙인다. 원문 문서가 영어라서
# 다국어 dense 벡터만으로는 약하고, sparse(어휘) 점수는 언어가 다르면 0이 되기 때문이다.
# 일반 RA 용어집이다. 특정 시험 질문에 맞춘 항목을 넣지 않는다.

terms:
  # 시험·설계
  비교 임상: [comparative clinical study]
  비교임상: [comparative clinical study]
  비교 효능: [comparative efficacy study, CES]
  효능 시험: [efficacy study]
  임상 시험: [clinical study, trial]
  3상: [Phase III]
  1상: [Phase I]
  PK 시험: [pharmacokinetic study, PK similarity study]
  약동학: [pharmacokinetics, PK]
  약력학: [pharmacodynamics, PD]
  건강한 자원자: [healthy subjects, healthy volunteers]
  건강인: [healthy subjects]
  대상자: [subjects]
  환자: [patients]
  군 구성: [treatment arms, parallel group]
  3군: [three-arm, 3-arm]
  용량: [dose]
  단회 투여: [single dose]
  피하: [subcutaneous, SC]
  정맥: [intravenous, IV]
  무작위: [randomised, randomized]
  이중눈가림: [double-blind]
  설계: [study design]
  시험 번호: [study number, study ID]
  # 평가변수·통계
  1차 평가변수: [primary endpoint]
  2차 평가변수: [secondary endpoint]
  평가변수: [endpoint]
  동등성 한계: [equivalence margin]
  동등성: [equivalence, equivalent]
  유사성: [similarity]
  신뢰구간: [confidence interval, CI]
  기하평균비: [geometric mean ratio, GMR, ratio of geometric means]
  기하평균: [geometric mean]
  군간 차이: [treatment difference]
  결과: [results]
  반응률: [response rate, responders]
  면역원성: [immunogenicity]
  항약물항체: [anti-drug antibody, ADA]
  ADA 양성: [ADA positive, ADA positivity]
  중화항체: [neutralising antibody, NAb]
  이상반응: [adverse event]
  안전성: [safety]
  유효성: [efficacy]
  분석에서 빠진: [excluded from the analysis]
  제외: [excluded]
  이유: [reason, due to]
  # 대조약·브리징
  대조약: [reference product, comparator]
  비미국: [non-U.S.-licensed comparator]
  EU 대조약: [EU-approved reference product, EU-Stelara]
  브리징: [scientific bridge, bridging]
  출처: [sourced, origin]
  # 인터체인저빌리티
  인터체인저블: [interchangeable, interchangeability]
  인터체인저빌리티: [interchangeability]
  상호교환: [interchangeable, interchangeability]
  스위칭: [switching, alternating]
  교대: [alternating, switches]
  라벨: [labeling, label, prescribing information]
  표시: [statement]
