  최종본: [final guidance]
  철회: [withdrawn]
  개정: [revision, revised, summary of changes]
  바뀐: [changes, revised, updated]
  바꿨: [changed, updated]
  달라: [differ, difference]
  다른가: [differ, difference]
  필요한가: [required, necessary, needed]
  필요: [required, necessary]
  조건: [conditions, circumstances]
  근거: [basis, justification, data supporting]
  심사: [review, assessment]
  허가: [approval, licensure, marketing authorisation]
  평가보고서: [assessment report]
