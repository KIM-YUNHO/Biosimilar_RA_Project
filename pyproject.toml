[project]
name = "ra-ingest"
version = "0.1.0"
description = "Biosimilar RA document ingestion (EMA / FDA / Health Canada)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
# object store on S3-compatible storage (RA_STORE=s3://bucket/prefix)
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "responses>=0.25"]
# preprocessing (ra-prep). Versions pinned to the ones the 2026-10-09 benchmark ran on.
prep = ["docling==2.137.0", "rapidocr==3.10.0", "pypdfium2>=5.14", "onnxruntime>=1.20"]
eval = ["rapidfuzz>=3.9"]
# chunking + bge-m3 embedding (ra_chunk); torch comes with docling in the prep extra
rag = ["transformers>=4.44", "huggingface_hub>=0.24", "numpy>=1.26"]
# answer generation (ra_answer): OpenAI chat API; tiktoken counts prompt tokens
llm = ["openai>=1.40", "tiktoken>=0.7"]

[project.scripts]
ra-ingest = "ra_ingest.cli:main"
ra-prep = "ra_prep.cli:main"
ra-index = "ra_chunk.cli:main"
ra-answer = "ra_answer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_ingest", "src/ra_prep", "src/ra_chunk", "src/ra_answer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
