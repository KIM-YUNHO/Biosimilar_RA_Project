[project]
name = "ra-ingest"
version = "0.1.0"
description = "Biosimilar RA document ingestion (EMA / FDA / Health Canada)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
ra-ingest = "ra_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
