[project]
name = "ra-ingest"
version = "0.1.0"
description = "Biosimilar RA document ingestion (EMA / FDA / Health Canada)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "responses>=0.25"]
# preprocessing (ra-prep). Versions pinned to the ones the 2026-10-09 benchmark ran on.
prep = ["docling==2.137.0", "rapidocr==3.10.0", "pypdfium2>=5.14", "onnxruntime>=1.20"]
eval = ["rapidfuzz>=3.9"]

[project.scripts]
ra-ingest = "ra_ingest.cli:main"
ra-prep = "ra_prep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_ingest", "src/ra_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
