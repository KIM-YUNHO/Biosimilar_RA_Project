# 검색 정답 세트 v1 (2026-10-11)
# 목적: 청킹·검색 방식 비교 시험. 답변 문장이 아니라 "반드시 찾아야 하는 근거 위치"를 정답으로 둔다.
#
# 정답 형식
#   evidence: 근거 묶음(관점) 목록. 묶음마다 any 안의 근거 중 하나만 찾으면 그 묶음을 맞힌 것으로 본다.
#     {doc: documents.id, page: 쪽, quote: 근거 블록 안의 짧은 원문}
#   채점: 검색된 청크가 같은 doc 이고, 정규화(NFKC, 소문자, 공백 제거)한 청크 텍스트에 quote 가
#         들어 있으면 그 근거를 찾은 것. 청킹 방식과 무관하게 같은 기준으로 채점된다.
#   지표: 묶음 재현율@k (찾은 묶음 / 전체 묶음), 문항 완전 정답률@k (모든 묶음을 찾은 문항 비율)
#   pending: 아직 전처리하지 않은 문서가 필요한 묶음. 해당 문서 처리 후 위치를 채우고, 그 전에는 채점에서 뺀다.
#
# 근거는 eval/retrieval/locate.py(키워드 검색)로 후보를 찾고 원문을 읽어 확정했다(prep-1.3 결과 기준).
# 상태: to_locate -> located(일부 pending 가능) -> reviewed(사람 검토)
# BAT2206 은 holdout 이라 적재하지 않았다(Q18 은 "없음"을 답해야 하는 문항).

questions:
  # ---------------- D2. 비교임상: 당시 vs 현재 ----------------
  - id: Q01
    scenario: D2
    type: fact
    question: "Pyzchiva(SB17)는 비교 임상(3상)을 했나? 시험 번호와 대상 환자는?"
    question_en: "Did Pyzchiva (SB17) have a comparative clinical (Phase III) study? What was the study number and patient population?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [SB17]
    evidence:
      - group: ema
        any:
          - {doc: 48, page: 12, quote: "Phase III study (SB17-3001) - a randomised, double-blind, multicentre study"}
          - {doc: 48, page: 111, quote: "Table 40. Summary of efficacy for trial SB17-3001"}
      - group: fda
        any:
          - {doc: 198, page: 65, quote: "Study SB17-3001 was a double-blind, parallel-group, multicenter study in 503 patients"}
      - group: hc
        any:
          - {doc: 232, page: 1, quote: "Study SB17-3001 was a confirmatory, Phase III, randomized, double-blind"}
    status: located

  - id: Q02
    scenario: D2
    type: compare
    question: "우스테키누맙 바이오시밀러 4개(SB17, ABP654, CT-P43, BMAB1200)의 비교 효능 시험 1차 평가변수와 동등성 한계를 비교해줘"
    question_en: "Compare the primary endpoint and equivalence margin of the comparative efficacy studies of the four ustekinumab biosimilars SB17, ABP654, CT-P43 and BMAB1200."  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [SB17, ABP654, CT-P43, BMAB1200]
    evidence:
      - group: SB17
        any:
          - {doc: 48, page: 120, quote: "the proposed equivalence margin of [-15%, 15%] in Study SB17-3001"}
      - group: ABP654
        any:
          - {doc: 8, page: 53, quote: "is outside an equivalence margin of (-15, 15)"}
      - group: CT-P43
        any:
          - {doc: 1, page: 64, quote: "the 95% CI for the treatment difference was entirely within -15% to 15%"}
          - {doc: 1, page: 86, quote: "contained within the pre-defined equivalence margin of [-15%, 15%]"}
      - group: BMAB1200
        any:
          - {doc: 41, page: 83, quote: "equivalence margin of ±13%"}
          - {doc: 41, page: 56, quote: "The equivalence margin was derived from the meta-analysis of the originator registration studies"}
    status: located

  - id: Q03
    scenario: D2
    type: number
    question: "CT-P43 3상의 1차 평가변수 결과(군간 차이와 신뢰구간)는?"
    question_en: "What were the primary endpoint results (treatment difference and confidence interval) of the CT-P43 Phase III study?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [CT-P43]
    evidence:
      - group: ema
        any:
          - {doc: 1, page: 86, quote: "the 95% CI of the adjusted treatment difference was -2.29 to 4.16"}
      - group: fda
        note: "FDA는 90% CI로 판단"
        any:
          - {doc: 183, page: 56, quote: "The 90% confidence interval (CI) for the treatment difference based on the mean percent change from baseline in PASI at Week 12"}
          - {doc: 183, page: 122, quote: "The 90% confidence interval (CI) for the treatment difference based on the mean percent change from baseline in PASI at Week 12"}
    status: located

  - id: Q04
    scenario: D2
    type: guidance_now
    question: "EMA 현행 기준으로 우스테키누맙 같은 단클론항체 바이오시밀러를 신청하면 비교 효능 시험이 필요한가? 조건은?"
    question_en: "Under current EMA standards, is a comparative efficacy study required for a monoclonal antibody biosimilar such as ustekinumab? Under what conditions?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    evidence:
      - group: when_waivable
        any:
          - {doc: 240, page: 15, quote: "biosimilars may be approved without providing CES or even PD data"}
          - {doc: 240, page: 13, quote: "CES may not add essential scientific knowledge in the decision for biosimilar approval"}
      - group: still_required
        any:
          - {doc: 240, page: 15, quote: "a well-defined comparative human PK study would still be required"}
          - {doc: 240, page: 13, quote: "a CES would still be required in scenarios that do not allow for a meaningful characterisation of PK"}
    status: located

  - id: Q05
    scenario: D2
    type: guidance_change
    question: "FDA는 비교 임상 효능 시험 요구를 2015 가이던스와 지금 사이에 어떻게 바꿨나?"
    question_en: "How did FDA change its expectation for comparative clinical efficacy studies between the 2015 guidance and now?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    evidence:
      - group: fda_2015
        note: "철회(2026-03-09) 상태가 함께 제시되어야 함"
        any:
          - {doc: 296, page: 21, quote: "a comparative clinical study will be necessary to support a demonstration of biosimilarity if there is residual uncertainty"}
      - group: fda_now_draft
        note: "초안 상태가 함께 제시되어야 함"
        any:
          - {doc: 269, page: 7, quote: "an appropriately designed human pharmacokinetic similarity study and an assessment of immunogenicity may be sufficient"}
          - {doc: 269, page: 5, quote: "the scientific approach to determine the need for CES has evolved"}
    status: located

  - id: Q06
    scenario: D2
    type: guidance_change
    question: "Health Canada 바이오시밀러 가이던스 개정에서 비교 임상 시험 관련으로 바뀐 점은?"
    question_en: "What changed regarding comparative clinical studies in the revision of the Health Canada biosimilar guidance?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    evidence:
      - group: summary_of_changes
        any:
          - {doc: 250, page: 1, quote: "Clinical studies should primarily include a comparative pharmacokinetic study"}
      - group: guidance_text
        any:
          - {doc: 249, page: 25, quote: "Comparative clinical efficacy studies are not typically required for a biosimilar candidate to a CRBD"}
          - {doc: 249, page: 10, quote: "generally limited to a comparative pharmacokinetic trial conducted to demonstrate pharmacokinetic equivalence"}
    status: located

  # ---------------- D3. 인터체인저빌리티 ----------------
  - id: Q07
    scenario: D3
    type: reasoning
    question: "Wezlana(ABP654)는 어떤 근거로 인터체인저블로 지정됐나?"
    question_en: "On what basis was Wezlana (ABP654) designated as interchangeable?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [ABP654]
    evidence:
      - group: fda_review
        any:
          - {doc: 158, page: 93, quote: "can be expected to produce the same clinical result as US-Stelara in any given patient"}
          - {doc: 158, page: 93, quote: "FDA considers the risk of a clinically impactful immunogenic response when alternating or switching"}
      - group: fda_letter
        note: "최초 허가 서한. 첫 인터체인저블 제품으로 첫 인터체인저블 독점 기간 대상"
        any:
          - {doc: 155, page: 4, quote: "for subcutaneous use as interchangeable with the corresponding presentations of US-licensed Stelara"}
          - {doc: 153, page: 1, quote: "for subcutaneous use as interchangeable with the corresponding presentations of US-licensed Stelara"}
          - {doc: 155, page: 6, quote: "are the first products relying on their respective reference products to receive a determination of interchangeability"}
    status: located

  - id: Q08
    scenario: D3
    type: fact
    question: "Wezlana 허가 때 스위칭 시험을 했나? 했다면 설계(교대 횟수, 대상, 평가변수)는?"
    question_en: "Was a switching study conducted for the Wezlana approval? If so, what was the design (number of switches, population, endpoints)?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [ABP654]
    note: "정답은 '별도 스위칭 시험 없이 지정'. FDA가 2023-09-01 서한으로 우스테키누맙에는 스위칭 시험이 일반적으로 불필요하다고 알림"
    evidence:
      - group: no_switching_study
        any:
          - {doc: 158, page: 93, quote: "Thus, a switching study that compares immunogenicity and PK and/or PD"}
          - {doc: 158, page: 22, quote: "a switching study would generally be considered unnecessary to support a demonstration of interchangeability"}
      - group: history
        any:
          - {doc: 158, page: 21, quote: "establish biosimilarity and interchangeability in the same study"}
    status: located

  - id: Q09
    scenario: D3
    type: compare
    question: "Pyzchiva, Steqeyma, Yesintek도 FDA 인터체인저블 지정을 받았나? 언제, 어떤 근거로?"
    question_en: "Did Pyzchiva, Steqeyma and Yesintek also receive FDA interchangeable designation? When and on what basis?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [SB17, CT-P43, BMAB1200]
    evidence:
      - group: BMAB1200
        note: "최초 허가 때는 첫 인터체인저블 독점 기간 때문에 인터체인저블 승인 불가(잠정 판정)"
        any:
          - {doc: 143, page: 32, quote: "FDA is unable to approve Bmab1200 injection 45 mg/0.5 mL PFS for subcutaneous use as interchangeable"}
          - {doc: 143, page: 4, quote: "unexpired first interchangeable exclusivity precluded approval"}
      - group: SB17
        note: "인터체인저블 요건은 충족(잠정 판정)했으나 Wezlana의 첫 인터체인저블 독점 기간 때문에 지정 보류"
        any:
          - {doc: 216, page: 152, quote: "provisionally determine that SB17 meets the standards for interchangeability"}
          - {doc: 216, page: 5, quote: "could not be approved as interchangeable due to unexpired first interchangeable exclusivity for Wezlana"}
      - group: CT-P43
        any:
          - {doc: 183, page: 27, quote: "stated that a switching study will not be conducted to demonstrate the interchangeability of CT-P43"}
          - {doc: 183, page: 21, quote: "CT-P43 can be expected to produce the same clinical result as that of US-Stelara in any given patient"}
    status: located

  - id: Q10
    scenario: D3
    type: guidance_change
    question: "FDA 인터체인저빌리티 가이던스는 2019 최종본과 2024 초안에서 스위칭 시험 요구가 어떻게 다른가?"
    question_en: "How do the 2019 final and 2024 draft FDA interchangeability guidances differ in what they expect for switching studies?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    evidence:
      - group: fda_2019
        any:
          - {doc: 256, page: 12, quote: "A switching study or studies will generally be expected to demonstrate"}
          - {doc: 256, page: 13, quote: "The primary endpoint in a switching study or studies should assess the impact of switching"}
      - group: fda_2024_draft
        any:
          - {doc: 267, page: 6, quote: "In the Interchangeability Guidance, the Agency recommended that applications or supplements seeking a determination of interchangeability include data from a switching study"}
          - {doc: 267, page: 7, quote: "Applicants may choose to provide an assessment of why the comparative analytical and clinical data"}
    status: located

  - id: Q11
    scenario: D3
    type: fact
    question: "인터체인저블 바이오시밀러 라벨에는 인터체인저블임을 어떻게 표시하나?"
    question_en: "How is interchangeability indicated in the labeling of an interchangeable biosimilar?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    note: "2018 최종본은 인터체인저블 표시를 추후 가이던스로 미룸 → 2023 초안은 인터체인저블도 같은 'biosimilar' 문구를 권고"
    evidence:
      - group: guidance_2023_draft
        any:
          - {doc: 266, page: 16, quote: "For a biosimilar or an interchangeable biosimilar product, FDA recommends including a statement that the product is biosimilar"}
      - group: guidance_2018
        any:
          - {doc: 255, page: 15, quote: "including any interchangeability statement similar to the biosimilarity statement"}
      - group: wezlana_label
        note: "최신 라벨(2026-05, doc 168)에는 'interchangeable' 문구가 없고 2023 초안 가이던스대로 'biosimilar*' 문구와 각주만 있음"
        any:
          - {doc: 168, page: 1, quote: "WEZLANA ® (ustekinumab-auub) is biosimilar* to STELARA ® (ustekinumab)."}
          - {doc: 168, page: 2, quote: "Biosimilarity of WEZLANA has been demonstrated for the condition(s) of use"}
    status: located

  # ---------------- D4. PK 시험 설계 비교 ----------------
  - id: Q12
    scenario: D4
    type: fact
    question: "SB17 PK 시험(SB17-1001)의 대상, 군 구성, 용량, 대조약 출처는?"
    question_en: "In the SB17 PK study (SB17-1001), what were the subjects, treatment arms, dose and source of the reference product?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [SB17]
    evidence:
      - group: design
        any:
          - {doc: 48, page: 160, quote: "Subjects received a single dose of 45 mg/0.5 mL of either Pyzchiva, EU-approved Stelara, or US-licensed Stelara"}
          - {doc: 48, page: 59, quote: "single dose, 3-arm study in healthy subjects"}
      - group: fda
        any:
          - {doc: 198, page: 31, quote: "PK similarity between SB17, US-Stelara, and EU-Stelara was evaluated in healthy subjects (Study SB17-1001)"}
    status: located

  - id: Q13
    scenario: D4
    type: compare
    question: "4개 제품의 PK 시험에서 대조약으로 EU-Stelara와 US-Stelara를 어떻게 썼나(3군 브리징 여부)?"
    question_en: "How did the PK studies of the four products use EU-Stelara and US-Stelara as comparators (three-arm bridging or not)?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [SB17, ABP654, CT-P43, BMAB1200]
    evidence:
      - group: SB17
        any:
          - {doc: 48, page: 59, quote: "3-arm study in healthy subjects to demonstrate similarity in PK"}
          - {doc: 198, page: 31, quote: "PK similarity between SB17, US-Stelara, and EU-Stelara was evaluated in healthy subjects"}
      - group: ABP654
        any:
          - {doc: 158, page: 33, quote: "following a single 90 mg SC injection of ABP 654, EU-Stelara, or US-Stelara"}
      - group: CT-P43
        any:
          - {doc: 1, page: 31, quote: "Study CT-P43 1.1 was a Phase 1, 2-part, randomised, double-blind, 3-arm"}
      - group: BMAB1200
        any:
          - {doc: 41, page: 51, quote: "establish PK equivalence between Bmab1200 and US-Stelara, Bmab1200 and EU-Stelara, and EU Stelara and US Stelara"}
          - {doc: 143, page: 43, quote: "The three way PK similarity between Bmab1200, US-Stelara and EU-Stelara was established"}
    status: located

  - id: Q14
    scenario: D4
    type: number
    question: "BMAB1200 PK 시험에서 AUC0-inf와 Cmax의 기하평균비와 90% 신뢰구간은?"
    question_en: "In the BMAB1200 PK study, what were the geometric mean ratios and 90% confidence intervals for AUC0-inf and Cmax?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [BMAB1200]
    evidence:
      - group: ema
        any:
          - {doc: 41, page: 43, quote: "Table 7: Summary of statistical analysis of pharmacokinetic parameters"}
      - group: fda
        any:
          - {doc: 143, page: 44, quote: "Table 7. Summary of statistical analyses for assessment of PK similarity (Study BM12H-NHV-01-G-01)"}
    status: located

  - id: Q15
    scenario: D4
    type: number
    question: "CT-P43 PK 시험에서 ADA 양성 여부에 따라 AUC0-inf와 Cmax가 어떻게 달랐나?"
    question_en: "In the CT-P43 PK study, how did AUC0-inf and Cmax differ by ADA status?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [CT-P43]
    evidence:
      - group: ema
        note: "gold 쪽 g05와 같은 표"
        any:
          - {doc: 1, page: 47, quote: "Table 15. Impact of ADA positivity"}
          - {doc: 1, page: 46, quote: "AUC0-inf were generally lower in subjects with positive ADA status"}
    status: located

  - id: Q16
    scenario: D4
    type: reasoning
    question: "비미국(EU) 대조약 데이터를 FDA 심사에 쓰려면 무엇이 필요하고, 각 제품은 어떻게 했나?"
    question_en: "What is needed to use data with a non-US (EU) comparator in an FDA submission, and how did each product do it?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [SB17, ABP654, CT-P43, BMAB1200]
    evidence:
      - group: guidance
        any:
          - {doc: 260, page: 7, quote: "the sponsor should provide adequate data or information to scientifically justify why such comparative data are relevant"}
          - {doc: 260, page: 8, quote: "would not obviate the need for comparative analytical data to scientifically justify use of a non-U.S.-licensed comparator"}
      - group: SB17
        any:
          - {doc: 198, page: 29, quote: "establish the scientific bridge to justify the relevance of data generated from the comparative clinical study SB17-3001"}
      - group: ABP654
        any:
          - {doc: 158, page: 17, quote: "the analytical component of the scientific bridge between ABP 654, US-licensed Stelara, and EU-approved Stelara was established"}
      - group: BMAB1200
        any:
          - {doc: 143, page: 28, quote: "establish the scientific bridge to justify the relevance of data generated from the comparative clinical study BM12H-PSO-03-G-02"}
      - group: CT-P43
        any:
          - {doc: 183, page: 18, quote: "establish the scientific bridge to justify the relevance of data generated from the comparative clinical study CT-P43 3.1"}
    status: located

  - id: Q17
    scenario: D4
    type: fact
    question: "SB17 PK 시험에서 분석에서 빠진 대상자와 그 이유는?"
    question_en: "Which subjects or samples were excluded from the analysis in the SB17 PK study, and why?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [SB17]
    evidence:
      - group: excluded_samples
        any:
          - {doc: 48, page: 43, quote: "excluded due to major protocol deviation (centrifuged in low speed)"}
          - {doc: 48, page: 45, quote: "excluded due to major protocol deviation (centrifuged in low speed)"}
      - group: discontinued
        any:
          - {doc: 48, page: 61, quote: "13 subjects; all due to COVID-19"}
    status: located

  # ---------------- 범위·예외 처리 ----------------
  - id: Q18
    scenario: scope
    type: unanswerable
    question: "BAT2206(Starjemza)의 FDA 심사 결과는?"
    question_en: "What was the outcome of the FDA review of BAT2206 (Starjemza)?"  # 비교용 사람 번역(검색 시스템 입력 아님)
    products: [BAT2206]
    evidence: []
    expected_behavior: "적재 문서 없음을 밝히고 추측하지 않는다(holdout)"
    status: located

  - id: Q19
    scenario: scope
